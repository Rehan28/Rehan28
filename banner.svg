<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="320" viewBox="0 0 1600 320">

  <!-- Flat dark background -->
  <rect width="1600" height="320" fill="#0d1117"/>

  <!-- Thin divider line -->
  <rect x="0" y="250" width="1600" height="1.5" fill="#1f2937"/>

  <!-- Title -->
  <text x="80" y="135" fill="#ffffff"
        font-size="44"
        font-weight="700"
        font-family="Segoe UI, Inter, Arial, sans-serif">
    Rakibul Islam Rehan
  </text>

  <!-- Subtitle -->
  <text x="80" y="180" fill="#d1d5db"
        font-size="20"
        font-family="Segoe UI, Inter, Arial, sans-serif">
    Software Engineer · Competitive Programmer
  </text>

  <!-- Tag pill -->
  <rect x="80" y="210" rx="14" ry="14" width="560" height="46"
        fill="#111827"
        stroke="#1f2937"/>

  <!-- Accent gradient text -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6CC644"/>
      <stop offset="100%" stop-color="#4183C4"/>
    </linearGradient>
  </defs>

  <text x="105" y="240"
        fill="url(#accent)"
        font-size="15"
        font-family="Segoe UI, Inter, Arial, sans-serif">
    3× ICPC Asia Dhaka Regional Finalist • 2500+ DSA Problems Solved
  </text>

</svg>
