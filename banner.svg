<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">

  <!-- Accent Gradient -->
  <defs>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <style>
      .font-base {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      }

      .name-text {
        font-size: 50px;
        font-weight: 800;
        fill: #ffffff;
      }

      .role-text {
        font-size: 22px;
        font-weight: 400;
        fill: #9ba3af;
        letter-spacing: 0.4px;
      }

      .stats-container {
        fill: #161b22;
        stroke-width: 1.5px;
      }

      .stats-base-text {
        font-size: 19px;
        font-weight: 500;
        fill: #c9d1d9;
        dominant-baseline: middle;
      }

      .stats-highlight {
        font-weight: 700;
        fill: url(#accent-gradient);
      }

      .octo {
        fill: #ffffff;
        opacity: 0.035;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#0d1117"/>

  <!-- Subtle Octocat pattern -->
  <g transform="translate(760, -30) scale(1.75)">
    <path class="octo" d="M160 128c0-17.6-14.4-32-32-32s-32 14.4-32 32c0 2.2 0.2 4.3 0.6 6.3l-27.5-18.4c-2.4-1.6-5.5-0.8-7.1 1.6l-16 24c-1.6 2.4-0.8 5.5 1.6 7.1l27.5 18.4c-0.2 1-0.3 2.1-0.3 3.1 0 17.6 14.4 32 32 32 8.8 0 16.8-3.6 22.6-9.4l23.6 23.6c2.4 2.4 6.3 2.4 8.7 0l24-24c2.4-2.4 2.4-6.3 0-8.7l-23.6-23.6c5.8-5.8 9.4-13.8 9.4-22.6zM128 144c-8.8 0-16-7.2-16-16s7.2-16 16-16 16 7.2 16 16-7.2 16-16 16z" />
  </g>

  <!-- Text Layout -->
  <g transform="translate(100, 130)" class="font-base">

    <text class="name-text" x="0" y="0">Hi — I'm Rakibul Islam Rehan</text>

    <text class="role-text" x="2" y="42">
      Software Engineer · Competitive Programmer
    </text>

    <!-- Stats pill -->
    <g transform="translate(0, 95)">
      <rect class="stats-container"
            x="-18" y="-30"
            width="700" height="62"
            rx="31"
            stroke="url(#accent-gradient)" />

      <text class="stats-base-text" x="12" y="3">
        <tspan class="stats-highlight">3×</tspan> ICPC Asia Regional Finalist
        <tspan dx="30" fill="#6b7280">•</tspan>
        <tspan dx="30" class="stats-highlight">2500+</tspan> DSA Problems Solved
      </text>
    </g>
  </g>
</svg>
